<div class="container mt-4">
  <h3>Gestion des réservations</h3>

  <!-- Formulaire de création -->
  <app-reservation-form (reservationCree)="onReservationCree()"></app-reservation-form>

  <!-- Erreur globale (annulation) -->
  <div *ngIf="errorMessage" class="alert alert-danger">
    <strong>Erreur :</strong> {{ errorMessage }}
    <button class="btn btn-sm btn-outline-danger ms-2" (click)="errorMessage = ''">Fermer</button>
  </div>

  <!-- Liste -->
  <app-reservation-list
    [reservations]="allReservations"
    [loading]="loading"
    [errorMessage]="errorMessage"
    (annuler)="onAnnuler($event)">
  </app-reservation-list>

  <!-- Bouton rafraîchir -->
  <button class="btn btn-outline-secondary btn-sm mt-3" (click)="loadReservations()">
    🔄 Rafraîchir
  </button>
</div>
