<div class="reservation-list-container">

  <!-- État : Erreur -->
  <div *ngIf="errorMessage && !loading" class="alert alert-danger">
    <strong>Erreur :</strong> {{ errorMessage }}
  </div>

  <!-- État : Chargement -->
  <div *ngIf="loading" class="text-center py-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement…</span>
    </div>
    <p class="mt-2 text-muted">Chargement des réservations…</p>
  </div>

  <!-- Filtre + tableau (pas d'erreur, pas en chargement) -->
  <div *ngIf="!loading && !errorMessage">
    <div class="d-flex align-items-center mb-3">
      <label class="me-2 fw-bold">Filtrer par statut :</label>
      <select class="form-select form-select-sm w-auto" [(ngModel)]="filtreStatut" (ngModelChange)="onFiltreChange()">
        <option *ngFor="let s of statuts" [value]="s">{{ s }}</option>
      </select>
    </div>

    <!-- État : Liste vide -->
    <div *ngIf="filteredReservations.length === 0" class="alert alert-info">
      Aucune réservation.
    </div>

    <!-- État : Données -->
    <table *ngIf="filteredReservations.length > 0" class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Livre</th>
          <th>Adhérent</th>
          <th>Statut</th>
          <th>Réservé le</th>
          <th>Expire le</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of filteredReservations">
          <td>{{ r.livreName }}</td>
          <td>{{ r.adherentName }}</td>
          <td>
            <span class="badge"
              [ngClass]="{
                'bg-warning text-dark': r.statut === 'EN_ATTENTE',
                'bg-success': r.statut === 'DISPONIBLE',
                'bg-secondary': r.statut === 'ANNULEE',
                'bg-danger': r.statut === 'EXPIREE',
                'bg-info': r.statut === 'HONOREE'
              }">{{ r.statut }}</span>
          </td>
          <td>{{ formatDate(r.dateReservation) }}</td>
          <td>{{ formatDate(r.dateExpiration) }}</td>
          <td>
            <button *ngIf="isAnnulable(r.statut)" class="btn btn-danger btn-sm"
              (click)="onAnnuler(r.reservationId)">
              Annuler
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
