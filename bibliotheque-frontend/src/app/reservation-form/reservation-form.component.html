<div class="reservation-form-container">
  <h4>Nouvelle réservation</h4>

  <div class="row g-3 align-items-end">
    <div class="col-md-5">
      <label class="form-label">Livre</label>
      <select class="form-select" [(ngModel)]="selectedLivreId">
        <option [ngValue]="null" disabled>— Choisir un livre —</option>
        <option *ngFor="let b of books" [ngValue]="b.bookId">
          {{ b.bookName }} ({{ b.noOfCopies }} ex.)
        </option>
      </select>
    </div>

    <div class="col-md-5">
      <label class="form-label">Adhérent</label>
      <select class="form-select" [(ngModel)]="selectedAdherentId">
        <option [ngValue]="null" disabled>— Choisir un adhérent —</option>
        <option *ngFor="let u of users" [ngValue]="u.userId">
          {{ u.name }} ({{ u.username }})
        </option>
      </select>
    </div>

    <div class="col-md-2">
      <button class="btn btn-primary w-100" [disabled]="!formValid || loading" (click)="onSubmit()">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
        Réserver
      </button>
    </div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>
</div>
